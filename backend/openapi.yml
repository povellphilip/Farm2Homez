components:
  schemas:
    AddToCartRequest:
      type: object
      properties:
        product_slug:
          type: string
          minLength: 1
          maxLength: 180
          pattern: ^[-a-zA-Z0-9_]+$
        quantity:
          type: integer
          maximum: 10000
          minimum: 1
          default: 1
      required:
      - product_slug
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          description: e.g. Home, Office
          maxLength: 40
        recipient_name:
          type: string
          maxLength: 150
        phone_number:
          type: string
          maxLength: 20
        line1:
          type: string
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        district:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 10
          pattern: ^[0-9]{4,10}$
        country:
          type: string
          maxLength: 60
        is_default:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - city
      - country
      - created_at
      - district
      - id
      - is_default
      - label
      - line1
      - line2
      - phone_number
      - postal_code
      - recipient_name
      - state
      - updated_at
    AddressInputRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          minLength: 1
          maxLength: 20
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: string
          default: ''
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 100
        district:
          type: string
          default: ''
          maxLength: 100
        state:
          type: string
          minLength: 1
          maxLength: 100
        postal_code:
          type: string
          minLength: 1
          maxLength: 10
          pattern: ^[0-9]{4,10}$
        country:
          type: string
          minLength: 1
          default: India
          maxLength: 60
      required:
      - city
      - line1
      - name
      - phone
      - postal_code
      - state
    AddressRequest:
      type: object
      properties:
        label:
          type: string
          description: e.g. Home, Office
          maxLength: 40
        recipient_name:
          type: string
          minLength: 1
          maxLength: 150
        phone_number:
          type: string
          minLength: 1
          maxLength: 20
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 100
        district:
          type: string
          maxLength: 100
        state:
          type: string
          minLength: 1
          maxLength: 100
        postal_code:
          type: string
          minLength: 1
          maxLength: 10
          pattern: ^[0-9]{4,10}$
        country:
          type: string
          minLength: 1
          maxLength: 60
      required:
      - city
      - line1
      - phone_number
      - postal_code
      - recipient_name
      - state
    AdminCategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 80
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        parent:
          type: integer
          nullable: true
        position:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        is_active:
          type: boolean
        created_at:
          type: string
