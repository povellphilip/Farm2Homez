# Local development with Docker: PostgreSQL + Django API + Vite dev server.
#   docker compose up --build        then open http://localhost:5173
#   docker compose exec backend python manage.py seed_demo --with-admin
# Not used in production (see infra/terraform and context/AWS_SETUP.md).

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: farm2home
      POSTGRES_USER: farm2home
      POSTGRES_PASSWORD: farm2home
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farm2home"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DJANGO_ENV: development
      DEBUG: "True"
      DATABASE_URL: postgresql://farm2home:farm2home@db:5432/farm2home
      DB_SSL_REQUIRE: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
    # Development server with auto-reload instead of the production entrypoint.
    entrypoint: ["sh", "-c"]
    command: ["python manage.py migrate_with_lock && python manage.py runserver 0.0.0.0:8000"]
    user: root
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22
    working_dir: /app
    command: ["sh", "-c", "npm ci && npx vite --host 0.0.0.0 --port 5173"]
    environment:
      VITE_DEV_API_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
